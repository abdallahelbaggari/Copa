/* =====================================================================
   PI NETWORK — MAINNET sign-in + payments
   Pattern proven in Copa / Humanitarian Hub:
   - Pi.init in piLogin AND submitPiPayment
   - onReadyForServerApproval: fire-and-forget fetch, no return, .then.then.catch
   - onReadyForServerCompletion: fetch .then.then.catch
   - server endpoints always answer HTTP 200
   ===================================================================== */
const PI_ENDPOINTS = { approve: '/approve', complete: '/complete', cancel: '/cancel-payment', verify: '/verify-user' };
let piAuthed = false;
let payBusy = false;
const PAYLOG_MAX = 12;
let payLogLines = [];
try { payLogLines = JSON.parse(sessionStorage.getItem('copa.paylog') || '[]'); } catch {}

function payLog(text, kind) {
  const t = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  payLogLines.push({ t, text, kind: kind || '' });
  payLogLines = payLogLines.slice(-PAYLOG_MAX);
  try { sessionStorage.setItem('copa.paylog', JSON.stringify(payLogLines)); } catch {}
  console.log('[COPA-PI]', text);
  const el = document.getElementById('payLog');
  if (el) el.innerHTML = payLogHtml();
}
function payLogHtml() {
  if (!payLogLines.length) return '<div class="pl-empty">Payment activity will appear here.</div>';
  return payLogLines.map((l) => `<div class="plog ${l.kind}"><time>${esc(l.t)}</time><span>${esc(l.text)}</span></div>`).join('');
}
function piMsg(text) { const m = document.getElementById('piMsg'); if (m) m.textContent = text || ''; }
function inPiBrowser() { return typeof window.Pi !== 'undefined'; }

function postJson(url, body) {
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
}

// Payments left unfinished last time (e.g. app closed mid-payment) must be resolved before a new one.
function onIncompletePaymentFound(payment) {
  const id = payment && payment.identifier;
  const txid = payment && payment.transaction && payment.transaction.txid;
  payLog('Found an unfinished payment ' + (id || '') + ' — resolving it…', 'warn');
  if (txid) {
    postJson(PI_ENDPOINTS.complete, { paymentId: id, txid: txid })
      .then(function (r) { return r.json(); })
      .then(function (d) { payLog(d.ok ? 'Unfinished payment completed.' : 'Could not complete the unfinished payment: ' + (d.error || 'unknown'), d.ok ? 'ok' : 'err'); })
      .catch(function () { payLog('Network error while completing the unfinished payment.', 'err'); });
  } else {
    postJson(PI_ENDPOINTS.cancel, { paymentId: id })
      .then(function (r) { return r.json(); })
      .then(function (d) { payLog(d.ok ? 'Unfinished payment cancelled. You can pay again.' : 'Could not cancel the unfinished payment: ' + (d.error || 'unknown'), d.ok ? 'ok' : 'err'); })
      .catch(function () { payLog('Network error while cancelling the unfinished payment.', 'err'); });
  }
}

function piLogin(opts) {
  opts = opts || {};
  if (!inPiBrowser()) { piMsg('Open Copa in the Pi Browser to sign in with Pi.'); return Promise.resolve(false); }
  if (!opts.silent) piMsg('Connecting to Pi…');
  try {
    Pi.init({ version: '2.0', sandbox: CONFIG.PI_SANDBOX });
  } catch (e) { piMsg('Pi sign-in is unavailable here. Open Copa in the Pi Browser.'); return Promise.resolve(false); }
  return Pi.authenticate(['username', 'payments'], onIncompletePaymentFound).then(function (auth) {
    piAuthed = true;
    piToken = auth.accessToken || null;
    piUser = (auth.user && auth.user.username) || null;
    try { sessionStorage.setItem('copa.piUser', piUser || ''); localStorage.setItem('copa.v1.piSignedIn', '1'); } catch {}
    // Confirm the login with Pi's servers (logged server-side as login:ok).
    postJson(PI_ENDPOINTS.verify, { accessToken: auth.accessToken })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (!d.ok) console.warn('[COPA-PI] login not confirmed by server:', d.error); })
      .catch(function () {});
    if (!opts.silent && location.hash.startsWith('#/me')) viewMe();
    if (location.hash.startsWith('#/predict')) { predMine = null; viewPredict(); }
    return true;
  }).catch(function (err) {
    piAuthed = false;
    if (!opts.silent) piMsg('Pi sign-in was cancelled or failed. You can keep using Copa without signing in.');
    console.warn('[COPA-PI] authenticate failed', err);
    return false;
  });
}

function piLogout() {
  piUser = null; piAuthed = false; piToken = null; predMine = null;
  try { sessionStorage.removeItem('copa.piUser'); localStorage.removeItem('copa.v1.piSignedIn'); } catch {}
  viewMe();
}

function submitPiPayment(amount) {
  if (payBusy) { payLog('A payment is already in progress.', 'warn'); return; }
  if (!CONFIG.PAY_AMOUNTS.includes(amount)) return;
  if (!inPiBrowser()) { payLog('Open Copa in the Pi Browser to pay with Pi.', 'err'); return; }
  const go = function () {
    try { Pi.init({ version: '2.0', sandbox: CONFIG.PI_SANDBOX }); } catch (e) {}
    payBusy = true;
    payLog('Starting payment of ' + amount + ' π…');
    Pi.createPayment({
      amount: amount,
      memo: 'Support Copa — ' + amount + ' Pi',
      metadata: { app: 'copa', kind: 'support', amount: amount },
    }, {
      onReadyForServerApproval: function (paymentId) {
        payLog('Approving payment ' + paymentId + '…');
        postJson(PI_ENDPOINTS.approve, { paymentId: paymentId })
          .then(function (r) { return r.json(); })
          .then(function (d) { payLog(d.ok ? 'Approved by Copa server. Confirm in your Pi wallet.' : 'Server did not approve: ' + (d.error || 'unknown'), d.ok ? '' : 'err'); })
          .catch(function () { payLog('Network error during approval.', 'err'); });
      },
      onReadyForServerCompletion: function (paymentId, txid) {
        payLog('Transaction sent. Completing…');
        postJson(PI_ENDPOINTS.complete, { paymentId: paymentId, txid: txid })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            payBusy = false;
            payLog(d.ok ? 'Payment complete — thank you for supporting Copa! (' + amount + ' π)' : 'Completion failed: ' + (d.error || 'unknown'), d.ok ? 'ok' : 'err');
          })
          .catch(function () { payBusy = false; payLog('Network error during completion. It will be finished next time you sign in.', 'err'); });
      },
      onCancel: function (paymentId) {
        payBusy = false;
        payLog('Payment cancelled.', 'warn');
      },
      onError: function (error, payment) {
        payBusy = false;
        payLog('Payment error: ' + ((error && error.message) || 'unknown'), 'err');
      },
    });
  };
  if (piAuthed) go();
  else {
    payLog('Signing in with Pi first…');
    piLogin().then(function (ok) { if (ok) go(); else payLog('Sign-in is needed to pay with Pi.', 'err'); });
  }
}

const sEl = $('#search'), sIn = $('#searchInput'), sRes = $('#searchRes');
let sTimer = null, sSeq = 0;
$('#searchBtn').addEventListener('click', () => { sEl.classList.add('open'); sIn.focus(); if (!sIn.value) searchHint(); });
$('#searchClose').addEventListener('click', closeSearch);
function closeSearch() { sEl.classList.remove('open'); }
sRes.addEventListener('click', (e) => { if (e.target.closest('a')) closeSearch(); });
sIn.addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(runSearch, 350); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSearch(); });
function searchHint() {
  sRes.innerHTML = `<div class="section-h"><h2>Popular</h2></div><div class="chips" style="flex-wrap:wrap">${['Arsenal', 'Real Madrid', 'Al Hilal', 'Enyimba', 'Premier League', 'Nigeria'].map((s) => `<button class="chip" data-s="${s}">${s}</button>`).join('')}</div>`;
  sRes.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { sIn.value = b.dataset.s; runSearch(); });
}
async function runSearch() {
  const q = sIn.value.trim();
  if (q.length < 2) { searchHint(); return; }
  const seq = ++sSeq;
  sRes.innerHTML = skeleton(1);
  const ql = q.toLowerCase();
  const local = [];
  for (const [, v] of memo) {
    const d = v.body?.data;
    if (Array.isArray(d)) d.forEach((m) => { if (m && m.home && (m.home.name.toLowerCase().includes(ql) || m.away.name.toLowerCase().includes(ql)) && !local.some((x) => x.id === m.id)) local.push(m); });
  }
  try {
    const r = await api('search?q=' + encodeURIComponent(q));
    if (seq !== sSeq) return;
    const { teams, competitions, partial } = r.data;
    let html = '';
    if (local.length) html += `<div class="section-h"><h2>Matches</h2></div>${compGroups(local.slice(0, 8), { star: false })}`;
    if (teams.length) html += `<div class="section-h"><h2>Teams</h2></div><div class="list">${teams.map((t) => `<a class="li" href="#/team/${t.id}">${crest(t.logo, t.name)}<div class="t"><b>${esc(t.name)}</b><small>${esc(t.country || '')}</small></div>${IC.chev}</a>`).join('')}</div>`;
    if (competitions.length) html += `<div class="section-h"><h2>Competitions</h2></div><div class="list">${competitions.map(compItem).join('')}</div>`;
    if (partial) html += `<div class="fresh">${q.length < 3 ? 'Type 3+ letters to search all teams.' : 'Some team lists are still loading — try again in a minute for complete results.'}</div>`;
    sRes.innerHTML = html || emptyState('No results', `Nothing matched “${q}” in the covered competitions.`);
  } catch (e) {
    if (seq !== sSeq) return;
    sRes.innerHTML = local.length ? compGroups(local) : errorState(e);
  }
}

  const T8 = ['NB', 'PR', 'LV', 'ST', 'RV', 'HB', 'SV', 'CR'], W4 = ['NB', 'LV', 'RV', 'SV'], W2 = ['NB', 'RV'];
  const ys8 = [16, 46, 86, 116, 156, 186, 226, 256], ys4 = [31, 101, 171, 241], ys2 = [66, 206], y1 = 136;
  const pill = (x, y, t, cls, d) => `<g class="bp ${cls}" style="animation-delay:${d}s"><rect x="${x}" y="${y - 11}" width="54" height="22" rx="11"/><text x="${x + 27}" y="${y + 4}">${t}</text></g>`;
  const link = (x1, ya, yb, x2, ym, d) => `<path class="bl" style="animation-delay:${d}s" d="M${x1} ${ya}H${x1 + 10}V${yb}H${x1}M${x1 + 10} ${ym}H${x2}"/>`;
  const BRACKET = `<svg class="ob-bracket" viewBox="0 0 300 272" aria-hidden="true">
      ${T8.map((t, k) => pill(0, ys8[k], t, W4.includes(t) ? 'win' : '', 0.2 + k * 0.05)).join('')}
      ${[0, 1, 2, 3].map((k) => link(54, ys8[2 * k], ys8[2 * k + 1], 78, ys4[k], 0.7 + k * 0.08)).join('')}
      ${W4.map((t, k) => pill(78, ys4[k], t, W2.includes(t) ? 'win' : '', 1.1 + k * 0.08)).join('')}
      ${[0, 1].map((k) => link(132, ys4[2 * k], ys4[2 * k + 1], 156, ys2[k], 1.5 + k * 0.1)).join('')}
      ${W2.map((t, k) => pill(156, ys2[k], t, 'win', 1.9 + k * 0.1)).join('')}
      ${link(210, ys2[0], ys2[1], 234, y1, 2.3)}
      <g class="bp final" style="animation-delay:2.7s"><rect x="234" y="${y1 - 15}" width="64" height="30" rx="15"/><text x="266" y="${y1 + 5}">NB</text></g>
      <g class="bcup" style="animation-delay:3.1s"><path d="M254 86h24v9a12 12 0 01-24 0z"/><rect x="263" y="106" width="6" height="8"/><rect x="257" y="114" width="18" height="5" rx="2"/></g>
    </svg>`;
  const PRED = `<div class="ob-pred">
      <div class="op-card"><div class="op-top"><span>Champions Trophy · Final</span><span>Sat 20:00</span></div>
        <div class="op-mid"><div class="op-t"><i style="background:#0B6E3F">NB</i>Northbridge</div>
          <div class="op-sc"><b class="op-n" id="obPh">0</b><span>:</span><b class="op-n" id="obPa">0</b></div>
          <div class="op-t r">Riverside<i style="background:#7A1F2B">RV</i></div></div>
        <div class="op-bot"><span class="op-saved" id="obSaved">Saved ✓</span><span class="op-pts" id="obPts">+3 · Exact score</span></div></div>
      <div class="op-lb"><div class="op-lh"><span>This week</span><span>Pts</span></div>
        <div class="op-r" id="obTop"><b>1</b><span>goalmachine</span><em>21</em></div>
        <div class="op-r me" id="obMe"><b>2</b><span>you</span><em id="obMePts">18</em></div>
        <div class="op-r"><b>3</b><span>pioneer_fc</span><em>17</em></div>
        <div class="op-r"><b>4</b><span>cupnights</span><em>15</em></div></div>
    </div>`;
  const slides = [
    `<section class="onb-slide nt"><div class="ob-night"><div class="ob-beam b1"></div><div class="ob-beam b2"></div><div class="ob-conf">${confetti}</div></div>
      <div class="ob-content center"><div class="ob-stage">${BIG_TROPHY}</div>
      <h2 class="ob-h">Every Cup.<br>One <em>App.</em></h2>
      <p class="ob-p">Champions League nights, CAF and Libertadores ties, the World Cup and AFCON: every knockout, all in one place.</p></div></section>`,
    `<section class="onb-slide lt"><div class="ob-light"></div><div class="ob-glow"></div>
      <div class="ob-content"><h2 class="ob-h">Live <em>Cup Nights</em></h2>
      <p class="ob-p">Scores update in real time with the minute, half-time, extra time and penalties.</p>
      <div style="display:flex;justify-content:center;margin-top:18px">${PHONE_LIVE}</div></div></section>`,
    `<section class="onb-slide nt"><div class="ob-night soft"></div>
      <div class="ob-content"><h2 class="ob-h">The Road to<br>the <em>Final</em></h2>
      <p class="ob-p">Interactive brackets with aggregate scores, two-legged ties and shoot-outs. See who goes through at a glance.</p>
      <div class="ob-bk-wrap">${BRACKET}</div></div></section>`,
    `<section class="onb-slide lt"><div class="ob-light"></div><div class="ob-glow" style="left:30%"></div>
      <div class="ob-content"><h2 class="ob-h">Predict. Score.<br><em>Climb.</em></h2>
      <p class="ob-p">Call the score before kick-off. Exact score 3 points, right result 1 point. Free to play, no Pi staked.</p>
      ${PRED}</div></section>`,
    `<section class="onb-slide nt"><div class="ob-night"><div class="ob-beam b1"></div><div class="ob-conf few">${confetti}</div></div>
      <div class="ob-content bottom"><div class="ob-mini-cup">${BIG_TROPHY}</div><h2 class="ob-h">Join the <em>Copa</em></h2>
      <p class="ob-p">Sign in with your Pi account to play the Predictor, follow your clubs and support Copa with Pi (optional).</p>
      <div class="ob-card">
        <button class="ob-signin" id="obSignin"><span class="pi">π</span><span>Sign in with Pi<small>Pi Mainnet</small></span></button>
        <button class="ob-guest" id="onbGuest">Continue as guest</button>
        <div class="ob-legal">By signing in you agree to the <a href="#/terms" data-legal>Terms of Use</a> and <a href="#/privacy" data-legal>Privacy Policy</a>.</div>
        <div class="ob-msg" id="onbMsg"></div>
      </div>
      <div class="ob-perks"><span>${ico.bolt}Lightweight</span><span>${ico.lock}Private</span><span>${ico.heart}Free</span></div>
      <div class="ob-copy">© ${new Date().getFullYear()} Copa · copa.pi</div>
      </div></section>`,
  ];
  const total = slides.length, scenes = total - 1;
  let i = 0, timerId = null, scoreTimer = null;
  const o = document.createElement('div');
  o.className = 'onb'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-label', 'Welcome to Copa');
  o.innerHTML = `
    <div class="onb-top"><div class="onb-brand">${MARK_SVG}<div><b>COPA</b><small>Every Cup. Every Upset. Every Champion.</small></div></div><button class="onb-skip" id="onbSkip">Skip</button></div>
    <div class="onb-track" id="onbTrack">${slides.join('')}</div>
    <div class="onb-foot" id="onbFoot"><div class="ob-dots" id="obDots" style="--dur:${SCENE_MS}ms">${Array.from({ length: scenes }, () => '<i></i>').join('')}</div>
      <button class="ob-next" id="onbNext">Next ${ARROW}</button></div>`;
  document.body.appendChild(o);
  if (CONFIG.PI_SANDBOX) { const sm = o.querySelector('.ob-signin small'); if (sm) sm.textContent = 'Pi Testnet'; }
  const track = o.querySelector('#onbTrack'), next = o.querySelector('#onbNext'), skip = o.querySelector('#onbSkip'),
    foot = o.querySelector('#onbFoot'), dotsWrap = o.querySelector('#obDots'), dotEls = [...dotsWrap.querySelectorAll('i')],
    signin = o.querySelector('#obSignin'), guest = o.querySelector('#onbGuest'), msg = o.querySelector('#onbMsg');
  const finish = () => { clearTimeout(timerId); clearInterval(scoreTimer); store.set('onboarded', true); o.style.opacity = '0'; o.style.transition = 'opacity .3s'; setTimeout(() => o.remove(), 320); if (location.hash.startsWith('#/me')) viewMe(); if (location.hash.startsWith('#/predict')) viewPredict(); };
  function demo(scene) {
    clearInterval(scoreTimer);
    const sc = o.querySelector('#obSc'), mn = o.querySelector('#obMin'), row = o.querySelector('#obRow1');
    if (sc) { sc.textContent = '1 - 1'; mn.textContent = "77'"; }
    const ph = o.querySelector('#obPh'), pa = o.querySelector('#obPa'), card = o.querySelector('.op-card'), me = o.querySelector('#obMe'), mePts = o.querySelector('#obMePts');
    if (ph) { ph.textContent = '0'; pa.textContent = '0'; card.classList.remove('saved', 'scored'); me.classList.remove('up'); mePts.textContent = '18'; me.querySelector('b').textContent = '2'; o.querySelector('#obTop b').textContent = '1'; }
    if (reduced) return;
    let t = 0;
    if (scene === 1) scoreTimer = setInterval(() => {
      t++;
      if (t === 2) { sc.textContent = '2 - 1'; row.classList.remove('ms-flash'); void row.offsetWidth; row.classList.add('ms-flash'); }
      mn.textContent = (77 + t) + "'";
      if (t >= 5) clearInterval(scoreTimer);
    }, 1100);
    if (scene === 3) scoreTimer = setInterval(() => {
      t++;
      if (t === 2) ph.textContent = '1';
      if (t === 3) ph.textContent = '2';
      if (t === 4) pa.textContent = '1';
      if (t === 6) card.classList.add('saved');
      if (t === 9) card.classList.add('scored');
      if (t === 10) { me.classList.add('up'); mePts.textContent = '22'; }
      if (t === 11) { me.querySelector('b').textContent = '1'; o.querySelector('#obTop b').textContent = '2'; clearInterval(scoreTimer); }
    }, 420);
  }
  function go(n) {
    clearTimeout(timerId);
    i = Math.max(0, Math.min(total - 1, n));
    track.style.transform = `translateX(-${i * 100}%)`;
    o.querySelectorAll('.onb-slide').forEach((sl, k) => { sl.classList.remove('play'); if (k === i) { void sl.offsetWidth; sl.classList.add('play'); } });
    dotEls.forEach((el, k) => { el.classList.remove('on', 'done'); if (k < i) el.classList.add('done'); if (k === i) { void el.offsetWidth; el.classList.add(reduced ? 'done' : 'on'); } });
    const last = i === total - 1;
    foot.classList.toggle('hide', last);
    o.classList.toggle('light', o.querySelectorAll('.onb-slide')[i].classList.contains('lt'));
    skip.style.visibility = last ? 'hidden' : 'visible';
    next.innerHTML = (i === scenes - 1 ? 'Get started ' : 'Next ') + ARROW;
    msg.textContent = '';
    demo(i);
    if (!last && !reduced) timerId = setTimeout(() => go(i + 1), SCENE_MS);
  }
  const pause = () => { clearTimeout(timerId); dotsWrap.classList.add('paused'); };
  const resume = () => {
    if (!dotsWrap.classList.contains('paused')) return;
    dotsWrap.classList.remove('paused');
    if (i < total - 1 && !reduced) timerId = setTimeout(() => go(i + 1), SCENE_MS / 2);
  };
  next.onclick = () => go(i + 1);
  skip.onclick = () => go(total - 1);
  signin.onclick = () => {
    if (!inPiBrowser()) { msg.textContent = 'Open Copa in the Pi Browser to sign in with Pi.'; return; }
    signin.disabled = true; signin.querySelector('span:last-child').firstChild.textContent = 'Connecting to Pi…';
    piLogin().then((ok) => {
      signin.disabled = false; signin.querySelector('span:last-child').firstChild.textContent = 'Sign in with Pi';
      if (ok) finish(); else msg.textContent = 'Sign-in was cancelled. Try again or continue as guest.';
    });
  };
  guest.onclick = finish;
  o.querySelectorAll('[data-legal]').forEach((a) => a.addEventListener('click', () => { clearTimeout(timerId); clearInterval(scoreTimer); o.remove(); }));
  let x0 = null;
  track.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; pause(); }, { passive: true });
  track.addEventListener('touchend', (e) => {
    const dx = x0 === null ? 0 : e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) { dotsWrap.classList.remove('paused'); go(i + (dx < 0 ? 1 : -1)); } else resume();
  });
  document.addEventListener('visibilitychange', function v() { if (!document.body.contains(o)) return document.removeEventListener('visibilitychange', v); if (document.hidden) pause(); else resume(); });
  document.addEventListener('keydown', function k(e) { if (!document.body.contains(o)) return document.removeEventListener('keydown', k); if (e.key === 'ArrowRight') go(i + 1); if (e.key === 'ArrowLeft') go(i - 1); });
  go(0);
}

/* =====================================================================
   ROUTER
   ===================================================================== */
function route(refresh = false) {
  const h = location.hash.replace(/^#\/?/, '') || 'home';
  const [a, b] = h.split('/');
  if (!refresh) window.scrollTo(0, 0);
  closeSearch();
  if (a === 'home') return viewHome(refresh);
  if (a === 'live') return viewLive(refresh);
  if (a === 'competitions') return viewCompetitions();
  if (a === 'competition' && /^a?\d+$/.test(b)) { if (!refresh) { state.compTab = isCup(b) ? 'bracket' : 'table'; compCache = null; } return viewCompetition(b, refresh); }
  if (a === 'match' && /^a?\d+$/.test(b)) { if (!refresh) { matchData = null; state.luSide = 'home'; } return viewMatch(b, refresh); }
  if (a === 'team' && /^a?\d+$/.test(b)) { if (!refresh) { state.teamTab = 'matches'; teamData = null; } return viewTeam(b, refresh); }
  if (a === 'tables') return viewTables(refresh);
  if (a === 'news') return viewNews(refresh);
  if (a === 'article' && b) { let id = ''; try { id = decodeURIComponent(h.slice('article/'.length)); } catch {} return viewArticle(id); }
  if (a === 'predict') return viewPredict();
  if (a === 'privacy') return viewLegal('privacy');
  if (a === 'terms') return viewLegal('terms');
  if (a === 'me') return viewMe();
  location.hash = '#/home';
}
window.addEventListener('hashchange', () => route());

/* boot */
(async function boot() {
  try { PROVIDER = (await api('status')).data; } catch { PROVIDER = null; }
  if (PROVIDER && !PROVIDER.configured) PROVIDER = null;
  if (PROVIDER) await loadCompInfo();
  loadFav();
  route();
  setTimeout(() => { hideSplash(); let signed = false; try { signed = localStorage.getItem('copa.v1.piSignedIn') === '1'; } catch {} if (!signed && !store.get('welcomed', false)) showOnboarding(); }, 900);
  // Inside the Pi Browser, quietly restore the Pi session (also resolves unfinished payments).
  window.addEventListener('load', () => {
    let was = false; try { was = localStorage.getItem('copa.v1.piSignedIn') === '1'; } catch {}
    if (inPiBrowser() && was) piLogin({ silent: true }).then((ok) => { if (ok && location.hash.startsWith('#/me')) viewMe(); });
  });
  // Keep the Live badge current while browsing other tabs.
  const badge = () => api('live').then((b) => updateLiveBadge(b.data.length)).catch(() => {});
  if (PROVIDER) { badge(); setInterval(() => { if (document.visibilityState === 'visible' && !location.hash.startsWith('#/live')) badge(); }, 60000); }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
})();
</script>
